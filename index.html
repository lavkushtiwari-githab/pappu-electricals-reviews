<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<title>Pappu Electricals Ghatampur – Google Reviews</title>
<meta name="description" content="Pappu Electricals Ghatampur Kanpur ke liye ready Hindi aur Hinglish Google reviews. Copy kare aur direct Google reviews page par paste kare.">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
    --primary: #0b57d0;
    --bg: #f1f3f6;
    --card: #ffffff;
    --text: #222;
    --muted: #666;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
}

header {
    background: var(--card);
    padding: 18px 16px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0;
    font-size: 20px;
}

header p {
    margin: 6px 0 0;
    font-size: 14px;
    color: var(--muted);
}

main {
    padding: 16px;
    max-width: 800px;
    margin: auto;
}

.review-box {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.review-text {
    font-size: 15px;
    line-height: 1.65;
}

button {
    margin-top: 12px;
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.2s ease;
}

button:active {
    transform: scale(0.97);
    background: #0845a3;
}

footer {
    text-align: center;
    padding: 20px 10px;
    font-size: 13px;
    color: var(--muted);
}
</style>
</head>

<body>

<header>
    <h1>Pappu Electricals – Review Copy Page</h1>
    <p>Review copy kare → Google Reviews page khul jayega</p>
</header>

<main id="reviews"></main>

<footer>
    © 2026 Pappu Electricals, Ghatampur Kanpur
</footer>

<script>
const GOOGLE_REVIEW_URL = "https://www.google.com/search?q=pappu+electricals+ghatampur+reviews&sourceid=chrome-mobile&ie=UTF-8#lkt=LocalPoiReviews";

const ALL_REVIEWS = [
    "पप्पू इलेक्ट्रिकल्स, घाटमपुर से बहुत अच्छी सर्विस मिली। घर की वायरिंग और स्विच बोर्ड का काम सही तरीके से किया गया। फैन और कूलर की वायर भी ठीक कर दी।",
    "Maine Pappu Electricals se mixer aur iron ka issue fix karwaya। kaam jaldi ho gaya aur charges bhi reasonable the।",
    "Ghar ke wiring cables aur switches ka kaam Pappu Electricals ne kiya। kaam safe aur proper tha। reliable electrical shop hai।",
    "Cooler aur fan ka problem ek hi visit me solve ho gaya। electrician experienced hai aur behaviour accha laga।",
    "House wiring ke liye Pappu Electricals best option laga। quality cable use hui aur fitting bhi strong hai।",
    "Shop ke lighting aur wiring ka kaam karwaya tha। kaam time par complete hua aur koi issue nahi aaya।",
    "Pappu Electricals Ghatampur me trusted naam hai। fan, switch aur socket ka repair sahi se kiya।",
    "Kanpur rural area me electrical goods aur repair ke liye achi jagah hai। kaam durable aur saaf tha।",
    "Iron aur extension board ka issue yahan theek karwaya। service fast thi aur cost bhi zyada nahi thi।",
    "Cooler wiring aur switch replacement ka kaam Pappu Electricals ne achha kiya। future me bhi yahin aaunga।"
];

// shuffle function
function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

function loadReviews() {
    const container = document.getElementById("reviews");
    container.innerHTML = "";

    const selected = shuffle([...ALL_REVIEWS]).slice(0, 5);

    selected.forEach(text => {
        const box = document.createElement("div");
        box.className = "review-box";

        box.innerHTML = `
            <div class="review-text">${text}</div>
            <button>Copy Review</button>
        `;

        box.querySelector("button").onclick = () => {
            navigator.clipboard.writeText(text).then(() => {
                window.location.href = GOOGLE_REVIEW_URL;
            });
        };

        container.appendChild(box);
    });
}

loadReviews();
</script>

</body>
</html>
