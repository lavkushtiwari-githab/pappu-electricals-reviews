let used = JSON.parse(localStorage.getItem("usedReviews") || "{}");

/* ===== HELPERS ===== */
function shuffle(arr){
  return arr.sort(()=>Math.random()-.5);
}

/* ===== UI RENDER ===== */
function showCategories(){
  const app=document.getElementById("app");
  app.innerHTML=`
    <div class="categories">
      <button class="cat-btn" onclick="showReviews('sales')">🛒 Electrical Items</button>
      <button class="cat-btn" onclick="showReviews('cooler')">❄️ Cooler / Seasonal</button>
      <button class="cat-btn" onclick="showReviews('house')">🏠 House Electrical</button>
      <button class="cat-btn" onclick="showReviews('shop')">🏪 Shop / Commercial</button>
      <button class="cat-btn" onclick="showReviews('repair')">🔧 Repair / Service</button>
    </div>
  `;
}

function showReviews(category){
  if(!used[category]) used[category]=[];

  const remaining = REVIEWS[category].filter(
    r => !used[category].includes(r)
  );

  const app=document.getElementById("app");
  app.innerHTML=`<button class="back" onclick="showCategories()">← Change Category</button>`;

  shuffle(remaining).slice(0,7).forEach(text=>{
    const div=document.createElement("div");
    div.className="review";
    div.innerHTML=`
      <p>${text}</p>
      <button>Copy Review</button>
    `;
    div.querySelector("button").onclick=()=>{
      navigator.clipboard.writeText(text).then(()=>{
        used[category].push(text);
        localStorage.setItem("usedReviews",JSON.stringify(used));
        window.location.href=GOOGLE_URL;
      });
    };
    app.appendChild(div);
  });
}
