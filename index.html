/* ===== LOAD REVIEWS ===== */
function load(){
  const container=document.getElementById("reviews");
  container.innerHTML="";

    return;

  shuffle(remaining).slice(0,5).forEach(text=>{

        localStorage.setItem("usedReviews",JSON.stringify(used));

    };
    container.appendChild(div);
